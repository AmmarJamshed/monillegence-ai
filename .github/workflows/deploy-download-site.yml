name: Deploy download site

on:
  push:
    branches: [main]
    paths:
      - 'packages/download-site/**'
      - '.github/workflows/deploy-download-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --filter @monillegence/download-site...
      - run: pnpm --filter @monillegence/download-site build
        env:
          VITE_BASE_PATH: /monillegence-ai/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/download-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
